[tools]
python = "3.14"
prek = "0.4.5"
typos = "1.47.2"
jq = "latest"
rust = { version = "latest", components = "clippy,rustfmt" }
rust-analyzer = "latest"
uv = "latest"   # provides `uvx`, used below to run mcp-proxy without a separate install step

[env]
PROJECT_ROOT = "{{ config_root }}"
PROJECT_NAME = "{{ config_root | basename }}"
SMOL_MACHINE = "{{ env.PROJECT_NAME }}-cc"
MCP_MISE_PORT = "8765"
MCP_MISE_URL = "http://host.smolvm.internal:{{ env.MCP_MISE_PORT }}/sse"

# Tasks live as individual scripts under mise-tasks/ instead of here.
