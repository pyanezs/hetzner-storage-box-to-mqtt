# Copy this file to config.toml and fill in real values.
# config.toml is gitignored — it holds secrets and is never committed.
#
# This file demonstrates every option the schema accepts, including ones that
# are optional and would normally be left out. See docs/configuration.md for
# the full reference.

[general]
# Whether to retry a failed Hetzner API call (5xx / connection errors only, not 4xx)
# or a failed MQTT publish, using a fixed backoff: 2, 4, 8, 16, 32, 64 seconds, then stop.
# Required.
retry_enabled = true
# One of: trace, debug, info, warn, error. Optional — defaults to "info" if omitted.
# Ignored if the RUST_LOG environment variable is set — RUST_LOG always takes
# precedence, and supports tracing's full per-module directive syntax.
log_level = "info"
# Daily clock times (24-hour HH:MM, local timezone) at which to run the
# fetch-and-publish cycle. The first cycle always runs immediately on
# startup, in addition to these. Optional — if empty or omitted, the app
# runs that one startup cycle and exits instead of staying resident.
run_times = ["03:00", "15:30"]

[hetzner]
# Can also be set via the HETZNER_API_TOKEN environment variable, which takes
# precedence over this file if set. Required, from one source or the other.
api_token = "CHANGE_ME"
# Optional — defaults to this value if omitted.
api_base_url = "https://api.hetzner.com/v1"

[mqtt]
# All fields below are required except where noted.
host = "mqtt.example.local"
port = 1883
username = "mqtt-user"
# Can also be set via the MQTT_PASSWORD environment variable, which takes
# precedence over this file if set.
password = "CHANGE_ME"
client_id = "hetzner-storage-box-to-mqtt"
# Prefix used for state topics: <base_topic>/<box id>/<field>/state
base_topic = "hetzner_storage_box"
# Prefix Home Assistant listens on for MQTT discovery.
discovery_prefix = "homeassistant"
# Accepted by the schema but not functionally implemented yet — the app always
# connects in plaintext and only logs a warning if this is true.
tls = false

# One [[storage_box]] block per Hetzner Storage Box you want to track.
# `id` is the numeric Hetzner Cloud resource id (not the name) — find it via the
# Hetzner Cloud Console. Required.
# A box with no matching [[storage_box]] entry, or `publish = false`, is never
# fetched or published.
[[storage_box]]
id = 12345678
# Optional — defaults to false (the box is neither fetched nor published).
publish = true
# Overrides the Home Assistant device name. Optional — defaults to the
# Hetzner-reported name if omitted. Must not be an empty string if set.
alias = "Backup Box"
# Every selectable field path (the full contents of src/fields.rs's
# KNOWN_FIELDS). Required to be non-empty when publish = true. `last_updated`
# is always published even if left out of this list — it's included here
# only so it can also be customized via field_meta below.
fields = [
  "id",
  "name",
  "status",
  "username",
  "server",
  "system",
  "created",
  "stats.size",
  "stats.size_data",
  "stats.size_snapshots",
  "storage_box_type.name",
  "storage_box_type.description",
  "storage_box_type.size",
  "location.name",
  "location.city",
  "location.country",
  "location.network_zone",
  "access_settings.reachable_externally",
  "access_settings.samba_enabled",
  "access_settings.ssh_enabled",
  "access_settings.webdav_enabled",
  "access_settings.zfs_enabled",
  "protection.delete",
  "labels",
  "last_updated",
]

# Optional, per-field Home Assistant metadata (friendly_name, unit_of_measurement,
# device_class — all three optional independently), keyed by the exact same
# dotted-path string used in `fields` above. Any field left out here still
# publishes fine — it just falls back to a title-cased version of its field
# path as its entity name (e.g. "stats.size" -> "Stats Size"), with no unit or
# device class. `stats.size`/`stats.size_data`/`stats.size_snapshots` are
# published in MiB (not the raw bytes the Hetzner API reports) and default to
# unit_of_measurement = "MiB" without needing an entry here. `last_updated`
# defaults to device_class = "timestamp" without needing an entry here.
[storage_box.field_meta]
"stats.size" = { friendly_name = "Used Size", unit_of_measurement = "MiB", device_class = "data_size" }
"stats.size_data" = { friendly_name = "Used Size (Data)", unit_of_measurement = "MiB", device_class = "data_size" }
"stats.size_snapshots" = { friendly_name = "Used Size (Snapshots)", unit_of_measurement = "MiB", device_class = "data_size" }
"storage_box_type.size" = { friendly_name = "Plan Capacity", unit_of_measurement = "B", device_class = "data_size" }
last_updated = { friendly_name = "Last Updated", device_class = "timestamp" }

[[storage_box]]
id = 87654321
publish = false
