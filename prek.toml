[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "check-added-large-files" },
  { id = "end-of-file-fixer" },
  { id = "check-toml" },
  { id = "check-json" },
  { id = "check-xml" },
  { id = "check-symlinks" },
  { id = "detect-private-key" },
  { id = "check-merge-conflict" },
]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "pretty-format-json", exclude = "lazy-lock\\.json$" },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "typos",
    name= "typos",
    language ="system",
    entry = "typos",
    exclude = "\\.(png|jpe?g|gif|bmp|ico|svg|webp|tiff?)$",
  },
]
